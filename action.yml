name: "SafeStack Findings Upload"
description: "Upload a scanner report to SafeStack's findings ingest API, authenticating with a scanner token or GitHub OIDC."
inputs:
  file:
    description: "Path to the scanner report file to upload."
    required: true
  format:
    description: "Report format: standard, sarif, semgrep, gosec, brakeman, sonarqube, trivy, or bandit."
    required: true
  repository-id:
    description: "SafeStack repository id (UUID)."
    required: true
  mode:
    description: "Upload mode: snapshot or delta."
    required: false
    default: "snapshot"
  scope:
    description: "Optional scope label for the uploaded findings."
    required: false
    default: ""
  category:
    description: "Optional finding category: sast, sca, secret, or iac."
    required: false
    default: ""
  token:
    description: "Scanner token. When omitted, GitHub OIDC is used instead, which requires permissions: id-token: write."
    required: false
    default: ""
  api-url:
    description: "Base URL of the SafeStack API."
    required: false
    default: "https://api.safestackai.com"
  audience:
    description: "OIDC audience requested from GitHub. Ignored when token is set."
    required: false
    default: "https://api.safestackai.com"
  fail-on-error:
    description: "Fail the job when the upload is rejected or fails to complete."
    required: false
    default: "true"
outputs:
  upload-id:
    description: "Id of the created upload."
    value: ${{ steps.upload.outputs.upload-id }}
  status-url:
    description: "URL to check the upload's processing status."
    value: ${{ steps.upload.outputs.status-url }}
  status:
    description: "Last known status of the upload."
    value: ${{ steps.upload.outputs.status }}
runs:
  using: "composite"
  steps:
    - name: Upload findings
      id: upload
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_REPOSITORY_ID: ${{ inputs.repository-id }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        ACTION_PATH: ${{ github.action_path }}
      run: "${ACTION_PATH}/upload.sh"
